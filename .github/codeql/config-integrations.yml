name: agijobsv0-codeql

queries:
  - uses: security-extended
  - uses: security-and-quality

paths:
  - agent-gateway
  - apps
  - monitoring
  - orchestrator
  - packages
  - scripts
  - services
  - shared
  - tools
  - integrations/alpha-agent

paths-ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.next/**"
  - "**/coverage/**"
  - "**/reports/**"
  # Preserve the original documentation exclusion on every old source root.
  # The newly admitted fixed native integration engine lives under vendor/docs.
  - "agent-gateway/**/docs/**"
  - "apps/**/docs/**"
  - "monitoring/**/docs/**"
  - "orchestrator/**/docs/**"
  - "packages/**/docs/**"
  - "scripts/**/docs/**"
  - "services/**/docs/**"
  - "shared/**/docs/**"
  - "tools/**/docs/**"
  - "**/data/**"
  - "**/deploy/**"
  - "**/deployment/**"
  - "**/deployments/**"
  - "**/subgraph/generated/**"
  - "**/subgraph/build/**"
  - "**/subgraph/node_modules/**"
  - "**/test/**"
