name: demo-redenomination

on:
  pull_request:
    paths:
      - 'scripts/v2/redenominationPlaybook.ts'
      - 'scripts/v2/launchRedenominationControlRoom.ts'
      - 'demo/REDENOMINATION/**'
      - 'config/agialpha.json'
      - 'config/owner-control.json'
      - 'config/stake-manager.json'
      - 'config/job-registry.json'
      - 'config/fee-pool.json'
      - 'package.json'
      - '.github/workflows/demo-redenomination.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/v2/redenominationPlaybook.ts'
      - 'scripts/v2/launchRedenominationControlRoom.ts'
      - 'demo/REDENOMINATION/**'
      - 'config/agialpha.json'
      - 'config/owner-control.json'
      - 'config/stake-manager.json'
      - 'config/job-registry.json'
      - 'config/fee-pool.json'
      - 'package.json'
      - '.github/workflows/demo-redenomination.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redenomination-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            codeload.github.com:443
            uploads.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            actions.githubusercontent.com:443
            actions-results.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'

      - name: Check saved artifacts before regeneration
        run: npm run demo:redenomination:verify

      - name: Exact arithmetic, worker acceptance, server and CLI tests
        run: node --test demo/REDENOMINATION/tests/*.test.cjs

      - name: Generate redenomination playbook
        run: npm run demo:redenomination:export -- --current-supply 42000000

      - name: Verify generated artifacts and review consoles
        env:
          NON_INTERACTIVE: '1'
        run: |
          npm run demo:redenomination:verify
          npm run demo:redenomination:guardian-drill
          npm run demo:redenomination:owner-console
          npm run demo:redenomination:mission-control
          node demo/REDENOMINATION/computer-work/review.cjs demo/REDENOMINATION/computer-work/conversion.example.json demo/REDENOMINATION/computer-work/dossier.example.md

      - name: Upload playbook artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: redenomination-playbook
          if-no-files-found: error
          path: |
            demo/REDENOMINATION/ui/export/latest.json
            demo/REDENOMINATION/config/*-redenominated.json
