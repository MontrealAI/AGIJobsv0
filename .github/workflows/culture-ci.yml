name: CULTURE Demo CI

on:
  push:
    paths:
      - 'demo/CULTURE-v0/**'
      - 'shared/structuredLogger.ts'
      - '.nvmrc'
      - '.github/workflows/culture-ci.yml'
  pull_request:
    paths:
      - 'demo/CULTURE-v0/**'
      - 'shared/structuredLogger.ts'
      - '.nvmrc'
      - '.github/workflows/culture-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: read

concurrency:
  group: culture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'
  COVERAGE_MIN: '90'
  PNPM_HOME: ~/.local/share/pnpm
  PNPM_CACHE_DIR: ~/.pnpm-store

jobs:
  lint:
    name: Workspace lint & formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Locate demo pnpm store
        id: pnpm-store
        working-directory: demo/CULTURE-v0
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache demo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-culture-pnpm-${{ hashFiles('demo/CULTURE-v0/pnpm-lock.yaml') }}
      - name: Install dependencies
        working-directory: demo/CULTURE-v0
        run: pnpm install --frozen-lockfile
      - name: ESLint / Prettier
        working-directory: demo/CULTURE-v0
        run: |
          pnpm lint
          pnpm format
          pnpm run test:quality-gates
          pnpm run typecheck:scripts

  solidity:
    name: Contracts (Foundry & Hardhat)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Locate demo pnpm store
        id: pnpm-store
        working-directory: demo/CULTURE-v0
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache demo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-culture-pnpm-${{ hashFiles('demo/CULTURE-v0/pnpm-lock.yaml') }}
      - name: Install dependencies
        working-directory: demo/CULTURE-v0
        run: pnpm install --frozen-lockfile
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e
        with:
          version: v1.4.4
      - name: Solhint lint
        working-directory: demo/CULTURE-v0
        run: pnpm exec solhint "contracts/**/*.sol"
      - name: Foundry tests & gas snapshot
        working-directory: demo/CULTURE-v0
        run: |
          pnpm run test:contracts
          pnpm run test:contracts:gas
      - name: Hardhat tests
        working-directory: demo/CULTURE-v0
        run: pnpm run test:contracts:hardhat
      - name: Compiled arena adapter lifecycle on a disposable local chain
        working-directory: demo/CULTURE-v0
        run: pnpm run test:arena-adapter
      - name: Coverage (Foundry & Hardhat)
        working-directory: demo/CULTURE-v0
        run: |
          pnpm run test:contracts:coverage
          pnpm run test:contracts:coverage:hardhat
      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: culture-contract-coverage
          path: |
            demo/CULTURE-v0/coverage
            demo/CULTURE-v0/lcov.info
            demo/CULTURE-v0/out

  static-analysis:
    name: Static analyzers
    runs-on: ubuntu-24.04
    needs: solidity
    timeout-minutes: 30
    env:
      MYTHX_API_KEY: ${{ secrets.MYTHX_API_KEY }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Locate demo pnpm store
        id: pnpm-store
        working-directory: demo/CULTURE-v0
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache demo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-culture-pnpm-${{ hashFiles('demo/CULTURE-v0/pnpm-lock.yaml') }}
      - name: Install dependencies
        working-directory: demo/CULTURE-v0
        run: pnpm install --frozen-lockfile
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Slither
        run: python -m pip install slither-analyzer==0.10.4 solc-select==1.0.4
      - name: Run Slither
        working-directory: demo/CULTURE-v0
        run: |
          pnpm exec hardhat compile
          slither . --config-file slither.config.json --compile-force-framework hardhat --hardhat-ignore-compile
      - name: MythX analysis
        if: ${{ env.MYTHX_API_KEY != '' }}
        working-directory: demo/CULTURE-v0
        env:
          MYTHX_API_KEY: ${{ env.MYTHX_API_KEY }}
        run: |
          docker run --rm \
            -e MYTHX_API_KEY \
            -v "${PWD}":/workspace \
            -w /workspace \
            mythx/mythx-cli:latest analyze contracts/CultureRegistry.sol contracts/SelfPlayArena.sol
      - name: MythX notice
        if: ${{ env.MYTHX_API_KEY == '' }}
        run: echo 'MythX API key not provided; skipping MythX analysis.'

  services:
    name: Package test suites
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Locate demo pnpm store
        id: pnpm-store
        working-directory: demo/CULTURE-v0
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache demo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-culture-pnpm-${{ hashFiles('demo/CULTURE-v0/pnpm-lock.yaml') }}
      - name: Install dependencies
        working-directory: demo/CULTURE-v0
        run: pnpm install --frozen-lockfile
      - name: Build services
        working-directory: demo/CULTURE-v0
        run: pnpm -r run build
      - name: Service coverage
        working-directory: demo/CULTURE-v0
        run: pnpm run test:services
      - name: Upload service coverage artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: culture-service-coverage
          path: |
            demo/CULTURE-v0/backend/arena-orchestrator/coverage
            demo/CULTURE-v0/indexers/culture-graph-indexer/coverage
            demo/CULTURE-v0/apps/culture-studio/coverage

  coverage-enforcement:
    name: Coverage & budget enforcement
    runs-on: ubuntu-24.04
    needs:
      - solidity
      - services
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download contract coverage artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: culture-contract-coverage
          path: demo/CULTURE-v0
      - name: Download service coverage artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: culture-service-coverage
          path: demo/CULTURE-v0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Locate demo pnpm store
        id: pnpm-store
        working-directory: demo/CULTURE-v0
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache demo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-culture-pnpm-${{ hashFiles('demo/CULTURE-v0/pnpm-lock.yaml') }}
      - name: Install dependencies
        working-directory: demo/CULTURE-v0
        run: pnpm install --frozen-lockfile
      - name: Coverage & budget enforcement
        working-directory: demo/CULTURE-v0
        run: |
          pnpm run check:coverage
          pnpm run check:budgets

  e2e:
    name: Cypress smoke
    runs-on: ubuntu-24.04
    needs:
      - solidity
      - services
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Locate demo pnpm store
        id: pnpm-store
        working-directory: demo/CULTURE-v0
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache demo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-culture-pnpm-${{ hashFiles('demo/CULTURE-v0/pnpm-lock.yaml') }}
      - name: Install dependencies
        working-directory: demo/CULTURE-v0
        run: pnpm install --frozen-lockfile
      - name: Start isolated local fixture stack
        working-directory: demo/CULTURE-v0
        run: node scripts/run-local-stack.mjs
      - name: Verify live service health and indexed seed artifacts
        working-directory: demo/CULTURE-v0
        run: node scripts/check-local-stack.mjs
      - name: Run Cypress (headless)
        working-directory: demo/CULTURE-v0
        run: |
          google-chrome --version
          pnpm exec cypress run --browser chrome --config-file cypress.config.ts
      - name: Capture stack logs on failure
        if: failure()
        working-directory: demo/CULTURE-v0
        run: node scripts/run-local-stack.mjs --logs
      - name: Shutdown stack
        if: always()
        working-directory: demo/CULTURE-v0
        run: node scripts/run-local-stack.mjs --down
