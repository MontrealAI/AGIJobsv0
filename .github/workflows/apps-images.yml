name: apps-images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - '.nvmrc'
      - '.github/workflows/apps-images.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.nvmrc'
      - '.github/workflows/apps-images.yml'

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.get_digest.outputs.digest }}
      registry_owner: ${{ steps.registry_owner.outputs.value }}
      subjects: ${{ steps.get_digest.outputs.subjects }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Normalize registry owner
        id: registry_owner
        run: |
          echo "REGISTRY_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build Console image
        id: build_console
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: apps/console
          file: apps/console/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/owner-console:${{ github.sha }}
          provenance: false
          sbom: false

      - name: Get Console digest (main)
        id: get_digest
        if: github.ref == 'refs/heads/main'
        run: |
          REF="ghcr.io/${{ env.REGISTRY_OWNER }}/owner-console:${{ github.sha }}"
          DIGEST="${{ steps.build_console.outputs.digest }}"
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          SUBJECTS=$(printf '%s  %s\n' "${DIGEST#sha256:}" "$REF" | base64 -w0)
          echo "subjects=$SUBJECTS" >> "$GITHUB_OUTPUT"

      - name: Trivy (OS – enforce)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image --scanners vuln \
              --pkg-types os \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              ghcr.io/${{ env.REGISTRY_OWNER }}/owner-console:${{ github.sha }}

      - name: Trivy (libraries – audit only)
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image --scanners vuln \
              --pkg-types library \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              ghcr.io/${{ env.REGISTRY_OWNER }}/owner-console:${{ github.sha }}

      - name: Promote scanned image (main)
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ghcr.io/${{ env.REGISTRY_OWNER }}/owner-console
          IMAGE_DIGEST: ${{ steps.build_console.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE_REF:latest" "$IMAGE_REF@$IMAGE_DIGEST"

  portal:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.get_digest.outputs.digest }}
      registry_owner: ${{ steps.registry_owner.outputs.value }}
      subjects: ${{ steps.get_digest.outputs.subjects }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Normalize registry owner
        id: registry_owner
        run: |
          echo "REGISTRY_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Node for web build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install portal dependencies
        run: npm ci --prefix apps/enterprise-portal

      - name: Webapp build
        run: npm --prefix apps/enterprise-portal run build

      - name: Login to GHCR (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build Portal image
        id: build_portal
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: apps/enterprise-portal/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/webapp:${{ github.sha }}
          provenance: false
          sbom: false

      - name: Get Portal digest (main)
        id: get_digest
        if: github.ref == 'refs/heads/main'
        run: |
          REF="ghcr.io/${{ env.REGISTRY_OWNER }}/webapp:${{ github.sha }}"
          DIGEST="${{ steps.build_portal.outputs.digest }}"
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          SUBJECTS=$(printf '%s  %s\n' "${DIGEST#sha256:}" "$REF" | base64 -w0)
          echo "subjects=$SUBJECTS" >> "$GITHUB_OUTPUT"

      - name: Trivy (OS – enforce)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image --scanners vuln \
              --pkg-types os \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              ghcr.io/${{ env.REGISTRY_OWNER }}/webapp:${{ github.sha }}

      - name: Trivy (libraries – audit only)
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image --scanners vuln \
              --pkg-types library \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              ghcr.io/${{ env.REGISTRY_OWNER }}/webapp:${{ github.sha }}

      - name: Promote scanned image (main)
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ghcr.io/${{ env.REGISTRY_OWNER }}/webapp
          IMAGE_DIGEST: ${{ steps.build_portal.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE_REF:latest" "$IMAGE_REF@$IMAGE_DIGEST"

  provenance-console:
    if: github.ref == 'refs/heads/main'
    needs: [console]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.console.outputs.subjects }}
      provenance-name: owner-console-${{ github.sha }}.intoto.jsonl

  provenance-portal:
    if: github.ref == 'refs/heads/main'
    needs: [portal]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.portal.outputs.subjects }}
      provenance-name: webapp-${{ github.sha }}.intoto.jsonl
