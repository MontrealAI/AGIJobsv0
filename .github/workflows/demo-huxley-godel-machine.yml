name: demo-huxley-godel-machine

on:
  push:
    branches: [main]
    paths:
      - 'demo/Huxley-Godel-Machine-v0/**'
      - 'demo/huxley_godel_machine_v0/**'
      - '.github/workflows/demo-huxley-godel-machine.yml'
      - 'Makefile'
  pull_request:
    paths:
      - 'demo/Huxley-Godel-Machine-v0/**'
      - 'demo/huxley_godel_machine_v0/**'
      - '.github/workflows/demo-huxley-godel-machine.yml'
      - 'Makefile'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: pytest demo/Huxley-Godel-Machine-v0/tests -q
      - name: Run demo with fast overrides
        run: |
          python demo/Huxley-Godel-Machine-v0/run_demo.py \
            --set "simulation.evaluation_latency=[0.0,0.0]" \
            --set "simulation.expansion_latency=[0.0,0.0]" \
            --output-dir demo/Huxley-Godel-Machine-v0/artifacts-ci
          cat demo/Huxley-Godel-Machine-v0/artifacts-ci/summary.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked website dependencies
        run: ./scripts/ci/npm-ci.sh
      - name: Build and verify HGM console
        run: |
          npm run demo:hgm:build
          npm run demo:hgm:test
          npm run demo:hgm:lint
          npm run demo:hgm:worker -- inspect build/hgm/records/reference.json
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify browser flows and accessibility
        run: npm run demo:hgm:qa
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hgm-browser-evidence
          path: reports/pages/hgm
          retention-days: 14
