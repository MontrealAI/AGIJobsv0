name: Dependency repair registry inspection (temporary)
on:
  push:
    branches: [fix/dependency-repair-20261011]
    paths: [.github/workflows/dependency-repair-research.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'MontrealAI/AGIJobsv0' && github.ref == 'refs/heads/fix/dependency-repair-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Inspect published compatibility candidates without installing or executing them
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          for package in hardhat@2.29.1 cypress@16.1.1 micromatch@latest jest@30.5.2 jest-config@30.5.2 jest-haste-map@30.5.2 ts-jest@latest tailwindcss@3.4.19 fast-glob@latest @ucanto/principal@9.0.3; do
            echo "=== $package ==="
            npm view "$package" name version engines dependencies peerDependencies dist.integrity repository --json
          done
          git diff --exit-code
