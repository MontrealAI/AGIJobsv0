name: demo-asi-takeoff

on:
  pull_request:
    paths:
      - 'demo/**'
      - 'contracts/**'
      - 'scripts/v2/**'
      - 'config/**'
      - 'hardhat.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/demo-asi-takeoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asi-takeoff-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            codeload.github.com:443
            uploads.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            actions-results.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443
            binaries.soliditylang.org:443
            pypi.org:443
            files.pythonhosted.org:443

      # This pinned action installs agent.service on GitHub-hosted Ubuntu.
      # Its step can succeed after agent startup fails; make that a job failure.
      # GitHub runner/cache transport endpoints are allowed by the action itself.
      - name: Verify runner hardening is active
        run: |
          test -s /home/agent/agent.status
          systemctl is-active --quiet agent.service

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: ./scripts/ci/npm-ci.sh

      - name: Planning, worker review, studio and report regressions
        run: node --test demo/asi-takeoff/tests/*.test.cjs

      - name: Optional Python launcher regression tests
        run: |
          python3 -m venv "$RUNNER_TEMP/takeoff-python"
          "$RUNNER_TEMP/takeoff-python/bin/python" -m pip install -r demo/asi-takeoff/requirements-cli.txt pytest==8.3.3
          "$RUNNER_TEMP/takeoff-python/bin/python" -m pytest --confcutdir=demo/asi-takeoff/tests demo/asi-takeoff/tests/test_run_demo.py -q

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e
        with:
          version: 'v1.4.4'

      - name: Run ASI Take-Off demo (deterministic kit)
        run: npm run demo:asi-takeoff

      - name: Run ASI Take-Off demo (local)
        env:
          RPC_URL: http://127.0.0.1:8545
          CHAIN_ID: '31337'
        run: npm run demo:asi-takeoff:local

      - name: Bundle actual local receipts
        run: npm run demo:asi-takeoff:kit -- --report-root reports/localhost/asi-takeoff --local-receipts reports/localhost/asi-takeoff/receipts --summary-md reports/localhost/asi-takeoff/asi-takeoff-report.md --network localhost

      - name: Verify runner hardening remained active
        if: always()
        run: |
          test -s /home/agent/agent.status
          systemctl is-active --quiet agent.service

      - name: Upload demo receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: asi-takeoff-receipts
          path: |
            reports/asi-takeoff/**
            reports/localhost/asi-takeoff/**
