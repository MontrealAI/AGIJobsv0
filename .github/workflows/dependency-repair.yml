name: Dependency repair qualification

on:
  pull_request:
    paths:
      - 'contracts/**'
      - '**/*.sol'
      - 'config/**'
      - 'deployment-config/**'
      - 'scripts/**'
      - '**/hardhat.config.*'
      - 'foundry.toml'
      - 'remappings.txt'
      - '.nvmrc'
      - '.npmrc'
      - '.node-version'
      - 'tsconfig*.json'
      - 'types/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/security/**'
      - 'scripts/release/audit-dependencies.cjs'
      - 'vendor/braces/**'
      - 'scripts/lib/w3up-upload.mjs'
      - 'scripts/onebox-static/release.mjs'
      - 'apps/onebox/scripts/publish.mjs'
      - 'apps/onebox-static/scripts/publish.mjs'
      - 'docs/security/DEPENDENCY_REPAIR_2026-10-11.md'
      - '.github/workflows/dependency-repair.yml'

permissions:
  contents: read

concurrency:
  group: dependency-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        surface: [libraries, contracts, browser, production-audit, full-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - run: npm install --global npm@10.8.2 --ignore-scripts --no-audit --fund=false
      - name: Install the committed dependency graph
        if: matrix.surface != 'production-audit' && matrix.surface != 'full-audit'
        run: npm ci --fetch-retries=1 --fetch-timeout=60000
      - name: Run compatibility checks and retain every actual result
        env:
          SURFACE: ${{ matrix.surface }}
          DEPENDENCY_PRESERVATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          npm_config_fetch_retries: '0'
          npm_config_fetch_timeout: '30000'
          CI: '1'
        shell: bash
        run: |
          set +e
          set -uo pipefail
          evidence="reports/dependency-repair-$SURFACE"
          mkdir -p "$evidence"
          failed=0
          run_check() {
            local name="$1"; shift
            local code
            if [ "$1" = run_preservation ]; then
              shift
              run_preservation "$@" > "$evidence/$name.log" 2>&1
            else
              "$@" > "$evidence/$name.log" 2>&1
            fi
            code=$?
            printf '%s %s\n' "$name" "$code" | tee -a "$evidence/exits.txt"
            cat "$evidence/$name.log"
            if [ "$code" != 0 ]; then failed=1; fi
            return "$code"
          }
          # Functional reviewed-source binding; this editable workflow is not
          # an independent approval authority or a deployment authorization.
          run_preservation() {
            local mode="$1"
            local policy_commit="35fd56967c9e36fdb5f86814b3dc3bdfb1feef1f"
            local bundle name origin_url
            # Explicit-head checkout fetches branches, not necessarily the event's
            # synthetic merge object. Fetch only that immutable SHA if absent;
            # the pinned checker still proves its exact parents and head tree.
            [[ "$GITHUB_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
            origin_url="$(git --no-replace-objects remote get-url origin)" || return 1
            case "$origin_url" in
              https://github.com/MontrealAI/AGIJobsv0|https://github.com/MontrealAI/AGIJobsv0.git) ;;
              *) return 1 ;;
            esac
            if ! git --no-replace-objects cat-file -e "$GITHUB_SHA^{commit}"; then
              git --no-replace-objects fetch --no-tags --no-recurse-submodules origin "$GITHUB_SHA" || return 1
            fi
            git --no-replace-objects cat-file -e "$policy_commit^{commit}" || return 1
            git --no-replace-objects merge-base --is-ancestor "$policy_commit" HEAD || return 1
            bundle="$(mktemp -d "$RUNNER_TEMP/jobs-source-policy.XXXXXX")" || return 1
            for name in check-dependency-preservation.cjs source-preservation-lib.cjs unreleased-source-policy.index.json unreleased-source-policy.json; do
              git --no-replace-objects show "$policy_commit:scripts/security/$name" > "$bundle/$name" || return 1
            done
            printf '%s  %s\n' '3e0fff09c845ebf721ee62fff167ac4b036a15f10d3326c0bf2cfcbe5afb590a' "$bundle/unreleased-source-policy.json" | sha256sum --check --status || return 1
            node "$bundle/check-dependency-preservation.cjs" "$mode" --root "$GITHUB_WORKSPACE"
          }
          run_check source-preservation run_preservation source
          run_check braces-provenance node scripts/security/verify-braces-patch.cjs --source
          case "$SURFACE" in
            libraries)
              run_check preflight npm run ci:preflight
              run_check compatibility npm run test:dependency-compat
              run_check eas-receipts node --test attestation/eas/test/receipt-digest.test.mjs
              run_check sbom npm run sbom:generate
              run_check publisher-syntax node --check scripts/onebox-static/release.mjs
              ;;
            contracts)
              if run_check compile npm run compile; then
                run_check size npm run release:check-size
                run_check local-deploy npm run deploy:local
                run_check deployer-tests npx --no-install hardhat test --no-compile test/v2/Deployer.test.js test/v2/DeploymentScripts.test.js test/v2/DeploymentCli.test.js
                run_check generated-preservation run_preservation generated
              fi
              ;;
            browser)
              run_check console-install npm --prefix apps/console ci --fetch-retries=1 --fetch-timeout=60000
              run_check cypress-verify npx --no-install cypress verify
              run_check browser npm run webapp:e2e
              ;;
            production-audit)
              run_check all-locks npm run release:audit-dependencies
              npm audit --package-lock-only --ignore-scripts --omit=dev --json --audit-level=high > "$evidence/audit-production.json"
              code=$?
              printf 'production-audit %s\n' "$code" | tee -a "$evidence/exits.txt"
              if [ "$code" != 0 ]; then failed=1; fi
              node -e 'const a=require("./reports/dependency-repair-production-audit/audit-production.json");if(a.error||!a.metadata?.vulnerabilities)process.exit(1);console.log(JSON.stringify(a.metadata.vulnerabilities));' || failed=1
              ;;
            full-audit)
              npm audit --package-lock-only --ignore-scripts --include=dev --include=optional --include=peer --json --audit-level=high > "$evidence/audit-full.json"
              code=$?
              printf 'full-audit %s\n' "$code" | tee -a "$evidence/exits.txt"
              if [ "$code" != 0 ]; then failed=1; fi
              node -e 'const a=require("./reports/dependency-repair-full-audit/audit-full.json");if(a.error||!a.metadata?.vulnerabilities)process.exit(1);console.log(JSON.stringify(a.metadata.vulnerabilities));for(const [n,v]of Object.entries(a.vulnerabilities||{}))if(["high","critical"].includes(v.severity))console.log(n,v.severity,JSON.stringify(v.via));' || failed=1
              ;;
          esac
          git rev-parse HEAD > "$evidence/candidate.txt"
          node --version > "$evidence/node-version.txt"
          npm --version > "$evidence/npm-version.txt"
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-${{ matrix.surface }}-${{ github.event.pull_request.head.sha }}
          path: |
            reports/dependency-repair-${{ matrix.surface }}/
            reports/release/dependency-audit/
            reports/sbom/
            cypress/screenshots/
          if-no-files-found: warn
          retention-days: 14
