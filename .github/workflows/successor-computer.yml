name: SUCCESSOR Computer Use

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: successor-computer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  laboratory:
    name: Verify native Computer Use and strategy evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Check out the exact native Alpha worker
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          repository: MontrealAI/AGI-Alpha-Agent-v0
          ref: 70dac8e5ce739978f5cd96d0fc190b6ebfcdf8d7
          path: .computer-lab-alpha
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bounded native worker dependencies and Chromium
        run: |
          python -m pip install pydantic==2.14.0 httpx==0.28.1 cryptography==50.0.1 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify strategy construction and immutable requirements
        run: node --test packages/successor-core/test/computer-mission.test.mjs
      - name: Execute real keyboard, mouse and screenshot actions
        run: |
          python integrations/alpha-agent/successor-computer-mission-lab.py --alpha-source .computer-lab-alpha --output reports/successor-computer-ci/accepted
          python integrations/alpha-agent/successor-computer-mission-lab.py --alpha-source .computer-lab-alpha --output reports/successor-computer-ci/prepared --prepare-only
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createComputerMission, runComputerMission} from './packages/successor-core/src/computer-mission.mjs';
          const mission = await createComputerMission({requirements:{earlyUnits:40, earlyDay:7, totalUnits:40, finalDay:14, budgetCents:51000}});
          const report = await runComputerMission(mission, {formulationApproval:{approved:true, ownerLabel:'CI hard-deadline reviewer', reason:'Preserve all forty units due by day seven while examining the formulation.'}});
          fs.writeFileSync('reports/successor-computer-ci/hard-deadline-report.json', JSON.stringify(report), {flag:'wx'});
          JS
          python integrations/alpha-agent/successor-computer-mission-lab.py --alpha-source .computer-lab-alpha --output reports/successor-computer-ci/hard-deadline --report reports/successor-computer-ci/hard-deadline-report.json
      - name: Reject late delivery and forged allocations
        shell: bash
        run: |
          set +e
          python integrations/alpha-agent/successor-computer-mission-lab.py --alpha-source .computer-lab-alpha --output reports/successor-computer-ci/late --inject-error late
          late_status=$?
          python integrations/alpha-agent/successor-computer-mission-lab.py --alpha-source .computer-lab-alpha --output reports/successor-computer-ci/forged --inject-error false-allocation
          forged_status=$?
          set -e
          test "$late_status" -eq 1
          test "$forged_status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('reports/successor-computer-ci')
          for name, accepted in [('accepted', True), ('hard-deadline', True), ('late', False), ('forged', False)]:
              evidence = json.loads((base / name / 'evidence.json').read_text())
              assert evidence['review']['accepted'] is accepted
              assert evidence['browserExecuted'] is True
              assert evidence['liveProvider'] is False
              assert evidence['sourceStableDuringRun'] is True
              assert evidence['externalFetches'] == []
              assert evidence['cleanup']['groupClosed'] is True
              assert evidence['freshProtectedProof'] is False
              assert evidence['productionApproved'] is False
          hard = json.loads((base / 'hard-deadline' / 'evidence.json').read_text())
          assert hard['observedResult']['plan']['costCents'] == 49000
          assert hard['observedResult']['check']['totals']['earlyUnits'] == 40
          prepared = json.loads((base / 'prepared' / 'execution-manifest.json').read_text())
          assert prepared['state'] == 'EXPORTED_NOT_EXECUTED'
          assert prepared['liveProviderExecuted'] is False
          PY
      - name: Preserve synthetic execution and rejection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: successor-computer-use-evidence
          path: reports/successor-computer-ci/
          retention-days: 30
          if-no-files-found: error
