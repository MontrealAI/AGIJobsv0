name: containers

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  actions: write
  packages: write
  id-token: write

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.image.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: node-runner
            context: .
            file: deploy/docker/orchestrator.Dockerfile
            tag: node-runner:latest
          - name: validator-runner
            context: .
            file: deploy/docker/attester.Dockerfile
            tag: validator-runner:latest
          - name: gateway
            context: .
            file: agent-gateway/Dockerfile
            tag: gateway:latest
          - name: webapp
            context: .
            file: apps/enterprise-portal/Dockerfile
            tag: webapp:latest
          - name: owner-console
            context: apps/console
            file: apps/console/Dockerfile
            tag: owner-console:latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
        with:
          driver-opts: network=host

      - name: Normalise image namespace
        run: |
          echo "REPO_OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR, single-arch, load)
        if: github.event_name == 'pull_request'
        id: build-pr
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          outputs: type=docker
          tags: ghcr.io/${{ env.REPO_OWNER_LC }}/${{ matrix.image.tag }}

      - name: Build candidate (main/tags, multi-arch, attestations)
        if: github.event_name != 'pull_request'
        id: build-push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          load: false
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ env.REPO_OWNER_LC }}/${{ matrix.image.name }}:candidate-${{ github.sha }}

      - name: Trivy scan (OS packages, every built architecture)
        env:
          IMAGE_NAME: ghcr.io/${{ env.REPO_OWNER_LC }}/${{ matrix.image.name }}
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          IMAGE_REF="${IMAGE_NAME}:latest"
          PLATFORMS="linux/amd64"
          if [ -n "$IMAGE_DIGEST" ]; then
            IMAGE_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
            PLATFORMS="linux/amd64 linux/arm64"
          fi
          for PLATFORM in $PLATFORMS; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore":/etc/trivy/.trivyignore:ro \
              aquasec/trivy:0.75.0 \
              image --scanners vuln --pkg-types os --platform "$PLATFORM" \
              --ignorefile /etc/trivy/.trivyignore \
              --severity HIGH,CRITICAL --exit-code 1 "$IMAGE_REF"
          done

      - name: Trivy scan (application packages, advisory)
        continue-on-error: true
        env:
          IMAGE_NAME: ghcr.io/${{ env.REPO_OWNER_LC }}/${{ matrix.image.name }}
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          IMAGE_REF="${IMAGE_NAME}:latest"
          if [ -n "$IMAGE_DIGEST" ]; then
            IMAGE_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
          fi
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore":/etc/trivy/.trivyignore:ro \
            aquasec/trivy:0.75.0 \
            image --scanners vuln --pkg-types library \
            --ignorefile /etc/trivy/.trivyignore \
            --severity HIGH,CRITICAL --exit-code 0 "$IMAGE_REF"

      - name: Promote scanned candidate to latest
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ghcr.io/${{ env.REPO_OWNER_LC }}/${{ matrix.image.name }}
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Upload container digest
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ steps.build-push.outputs.digest }}" > digest.txt
        shell: bash

      - name: Publish digest artefact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.image.name }}-digest
          path: digest.txt
