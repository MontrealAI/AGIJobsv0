name: Meta-Agentic ALPHA suite

on:
  push:
    branches: [main]
    paths:
      - 'demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/**'
      - '.github/workflows/demo-meta-agentic-alpha-agi-jobs.yml'
      - 'requirements-python.txt'
      - 'orchestrator/**'
      - 'apps/orchestrator/computerWork.ts'
      - 'agent-gateway/agentEndpoint.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'website/assets/diagram-source.mjs'
  pull_request:
    paths:
      - 'demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/**'
      - '.github/workflows/demo-meta-agentic-alpha-agi-jobs.yml'
      - 'requirements-python.txt'
      - 'orchestrator/**'
      - 'apps/orchestrator/computerWork.ts'
      - 'agent-gateway/agentEndpoint.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'website/assets/diagram-source.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-meta-agentic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 'Run Meta-Agentic demo suite'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-python.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-python.txt

      - name: Run unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          pytest demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/tests -q

      - name: Rehearse all twelve Python CLIs in isolation
        run: python demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/scripts/rehearse.py --out reports/meta-agentic-alpha/python-ci

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta-agentic-demo-artefacts
          retention-days: 14
          path: |
            reports/meta-agentic-alpha/python-ci/
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/latest_run.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/latest_run_v2.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/latest_run_v3.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/latest_run_v4.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/latest_run_v5.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/latest_run_v6.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/latest_run_v7.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/latest_run_v8.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/latest_run_v9.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/latest_run_v10.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/latest_run_v11.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/orchestrator/scoreboard.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/orchestrator_v3/scoreboard.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/orchestrator_v4/scoreboard.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/orchestrator_v5/scoreboard.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/orchestrator_v6/scoreboard.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/orchestrator_v7/scoreboard.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/orchestrator_v8/scoreboard.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/orchestrator_v9/scoreboard.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/orchestrator_v10/scoreboard.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/storage/orchestrator_v11/scoreboard.json
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/reports/alpha_deck.md
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v10/ui/
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v10/reports/generated/alpha_meta_supremacy_masterplan.md
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v2/reports/generated/alpha_masterplan_run.md
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v3/reports/generated/meta_synthesis.md
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v4/reports/generated/alpha_flight_synthesis.md
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v5/reports/generated/meta_conductor_masterplan.md
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v5/ui/
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v6/reports/generated/alpha_dominion_masterplan.md
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v6/ui/
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v7/reports/generated/alpha_singularity_masterplan.md
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v7/ui/
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v8/reports/generated/alpha_meta_convergence_masterplan.md
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v8/ui/
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v9/reports/generated/alpha_meta_sovereignty_masterplan.md
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v9/ui/
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v11/reports/generated/alpha_meta_singularity_masterplan.md
            demo/Meta-Agentic-ALPHA-AGI-Jobs-v0/meta_agentic_alpha_v11/ui/

  workbench:
    name: Verify delivery workbench and preserved dashboards
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked dependencies and browser
        run: |
          ./scripts/ci/npm-ci.sh
          npx playwright install --with-deps chromium
      - name: Verify projections, evidence and admitted adapter fixtures
        run: |
          npm run test:meta-agentic-alpha
          npm run demo:meta-agentic-alpha:test
          npm run demo:meta-agentic-alpha:work
      - name: Verify complete browser experience
        run: npm run demo:meta-agentic-alpha:qa
      - name: Preserve browser and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta-agentic-alpha-workbench-evidence
          path: reports/meta-agentic-alpha/
          retention-days: 14
