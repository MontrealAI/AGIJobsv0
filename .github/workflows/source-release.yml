name: Qualified source release

on:
  pull_request:
    paths:
      - '.github/workflows/source-release.yml'
      - 'scripts/release/qualify-source-release.cjs'
      - 'scripts/release/publish-source-release.cjs'
      - 'test/scripts/source-release-gate.test.cjs'
      - 'test/scripts/source-release-publish.test.cjs'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/source-release.yml'
      - 'scripts/release/qualify-source-release.cjs'
      - 'scripts/release/publish-source-release.cjs'

permissions:
  contents: read

concurrency:
  group: source-release-rc13-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - run: node --test test/scripts/source-release-gate.test.cjs test/scripts/source-release-publish.test.cjs

  publish:
    name: Publish qualified source prerelease
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'MontrealAI/AGIJobsv0'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: write
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: source-v2.1.0-rc.13
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Qualify every required check and observed main workflow on this exact commit
        run: node scripts/release/qualify-source-release.cjs
      - name: Retain and verify the qualified compiler producer archive
        run: node scripts/release/publish-source-release.cjs --collect-compiler-evidence
      - name: Build checksummed source and evidence assets
        run: |
          set -euo pipefail
          out=reports/source-release
          git archive --format=zip --prefix=AGIJobsv0/ "$GITHUB_SHA" > "$out/$TAG-source.zip"
          cp docs/deployments/ethereum-mainnet-2026-10-12.json "$out/"
          cp website/data/jobs-mainnet-2026-10-18.json "$out/"
          cp docs/deployments/evidence/configuration-readback-2026-10-13.json "$out/"
          cp docs/production/mainnet-deployment-2026-10-12.md "$out/"
          cp docs/production/RELEASE_NOTES_SOURCE_RC13.md "$out/"
          cp docs/production/compiler-warnings-2026-10-13.md "$out/"
          cp config/solidity-compiler.json "$out/"
          cp docs/deployment-addresses.mainnet.json "$out/"
          cd "$out"
          sha256sum -- *.json *.md *.zip > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Retain exact release producer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-rc13-${{ github.sha }}
          path: reports/source-release/
          if-no-files-found: error
          overwrite: true
      - name: Resume or create the exact source release and verify all assets
        run: node scripts/release/publish-source-release.cjs
