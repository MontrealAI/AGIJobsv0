name: Demo gallery
on:
  pull_request:
    paths:
      - 'demo/**'
      - 'scripts/demo/**'
      - 'scripts/production/commissioning.cjs'
      - 'test/scripts/demo-catalog.test.cjs'
      - 'test/scripts/demo-commissioning.test.cjs'
      - 'test/scripts/local-demo-rpc.test.cjs'
      - 'package.json'
      - 'requirements-python.txt'
      - 'services/meta_api/requirements.txt'
      - '.github/workflows/demo-gallery.yml'
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'scripts/demo/**'
      - 'scripts/production/commissioning.cjs'
      - 'test/scripts/demo-catalog.test.cjs'
      - 'test/scripts/demo-commissioning.test.cjs'
      - 'test/scripts/local-demo-rpc.test.cjs'
      - 'package.json'
      - 'requirements-python.txt'
      - 'services/meta_api/requirements.txt'
      - '.github/workflows/demo-gallery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-gallery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: .:packages/hgm-core/src
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-python.txt
            services/meta_api/requirements.txt
            demo/Tiny-Recursive-Model-v0/requirements-core.txt
      - name: Verify complete catalog and local-launcher safety
        run: |
          node scripts/demo/catalog.cjs --check
          node --test test/scripts/demo-catalog.test.cjs test/scripts/demo-commissioning.test.cjs test/scripts/local-demo-rpc.test.cjs
      - name: Install headless demo test dependencies
        run: |
          python -m pip install -r requirements-python.txt -r demo/Tiny-Recursive-Model-v0/requirements-core.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip check
      - name: Exercise every discovered Python demo suite in isolation
        run: python demo/run_demo_tests.py --runner python --timeout 180
