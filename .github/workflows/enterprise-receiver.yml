name: Enterprise receiver source checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-policy:
    name: Zero-cap receiver literals (not installed acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Bind exact source and run original receiver controls
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir -p "$RUNNER_TEMP/enterprise-receiver"
          git rev-parse HEAD > "$RUNNER_TEMP/enterprise-receiver/source.txt"
          node --version > "$RUNNER_TEMP/enterprise-receiver/runtime.txt"
          sha256sum integrations/alpha-agent/enterprise-work-request.mjs integrations/alpha-agent/enterprise-work-request.test.mjs integrations/alpha-agent/discovery-lab-contract.mjs > "$RUNNER_TEMP/enterprise-receiver/SHA256SUMS"
          node --test --test-reporter=tap integrations/alpha-agent/enterprise-work-request.test.mjs 2>&1 | tee "$RUNNER_TEMP/enterprise-receiver/literal-controls.tap"
          printf '%s\n' 'Actual-Alpha optional cases are NOT_RUN. No installed or runtime qualification claimed.' > "$RUNNER_TEMP/enterprise-receiver/SCOPE.txt"
      - name: Preserve actual result including failures and skips
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise-receiver-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/enterprise-receiver
          if-no-files-found: error
