name: Dependency repair candidate (temporary)
on:
  push:
    branches: [fix/dependency-repair-20261011]
    paths: [.github/workflows/dependency-repair-resolve.yml]
permissions:
  contents: read
concurrency:
  group: dependency-repair-candidate
  cancel-in-progress: false
jobs:
  resolve:
    if: github.repository == 'MontrealAI/AGIJobsv0' && github.ref == 'refs/heads/fix/dependency-repair-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.commit.outputs.candidate }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - run: npm install --global npm@10.8.2 --ignore-scripts --no-audit --fund=false
      - name: Resolve compatible published Cypress and the exact Hardhat override
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.3
          test "$(npm --version)" = 10.8.2
          npm view cypress@15.21.1 name version engines dependencies dist.integrity --json > "$RUNNER_TEMP/cypress-candidate.json"
          cat "$RUNNER_TEMP/cypress-candidate.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          candidate = json.loads(Path(os.environ['RUNNER_TEMP'],'cypress-candidate.json').read_text())
          assert candidate['version'] == '15.21.1'
          assert 'extract-zip' not in candidate['dependencies']
          p = Path('package.json')
          data = json.loads(p.read_text())
          assert data['devDependencies']['cypress'] == '16.1.1'
          assert data['overrides']['@ethereum-attestation-service/eas-contracts']['hardhat'] == '2.29.1'
          data['devDependencies']['cypress'] = '15.21.1'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          t = Path('scripts/security/test/dependency-compat.test.cjs')
          text = t.read_text()
          assert text.count("'16.1.1'") == 1
          t.write_text(text.replace("'16.1.1'", "'15.21.1'"))
          PY
          npm update hardhat --package-lock-only --ignore-scripts --no-audit --fund=false
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          before = json.loads(subprocess.check_output(['git','show','HEAD:package-lock.json']))['packages']
          after = json.loads(Path('package-lock.json').read_text())['packages']
          for name in ['hardhat','solc','@openzeppelin/contracts','@prb/math','@ethereum-attestation-service/eas-contracts']:
              key = 'node_modules/' + name
              if key not in before: continue
              for field in ['version','resolved','integrity']:
                  assert before[key].get(field) == after[key].get(field), (key,field)
          for p,v in after.items():
              if p.endswith('/node_modules/hardhat') or p == 'node_modules/hardhat':
                  print('HARDHAT_RESOLUTION', p, v['version'])
                  assert v['version'] == '2.29.1', p
          allowed = {'package.json','package-lock.json','scripts/security/test/dependency-compat.test.cjs'}
          changed = subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed) <= allowed, changed
          print('PRESERVATION: Solidity/compiler/deployment source and selected dependency identities unchanged.')
          PY
      - name: Commit only the repaired peer and dependency resolutions
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/dependency-repair-20261011
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git add -- package.json package-lock.json scripts/security/test/dependency-compat.test.cjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Use peer-compatible patched Cypress and refresh nested Hardhat resolution'
          export AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$AUTH_HEADER" push origin HEAD:refs/heads/fix/dependency-repair-20261011
          unset AUTH_HEADER GH_TOKEN
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-resolution-${{ github.sha }}
          path: |
            package.json
            package-lock.json
            scripts/security/test/
            scripts/lib/w3up-upload.mjs
            apps/onebox/scripts/publish.mjs
            apps/onebox-static/scripts/publish.mjs
            scripts/onebox-static/release.mjs
          retention-days: 14
  compatibility:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ needs.resolve.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - run: npm install --global npm@10.8.2 --ignore-scripts --no-audit --fund=false
      - run: npm ci
      - name: Run independent compatibility checks and preserve every exit status
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p reports/dependency-repair-validation
          failed=0
          run_check() {
            name="$1"; shift
            "$@" > "reports/dependency-repair-validation/$name.log" 2>&1
            code=$?
            printf '%s %s\n' "$name" "$code" | tee -a reports/dependency-repair-validation/exits.txt
            tail -n 100 "reports/dependency-repair-validation/$name.log"
            if [ "$code" != 0 ]; then failed=1; fi
            return "$code"
          }
          run_check preflight npm run ci:preflight
          run_check compatibility npm run test:dependency-compat
          run_check receipt node --test attestation/eas/test/receipt-digest.test.mjs
          run_check sbom npm run sbom:generate
          run_check cypress npx --no-install cypress verify
          if run_check compile npm run compile; then
            run_check size npm run release:check-size
            run_check local-deploy npm run deploy:local
            run_check deployer-tests npx --no-install hardhat test --no-compile test/v2/Deployer.test.js test/v2/DeploymentScripts.test.js test/v2/DeploymentCli.test.js
          fi
          run_check preservation git diff --exit-code -- contracts hardhat.config.js deployment-config config scripts/v2 scripts/generate-constants.ts
          git rev-parse HEAD > reports/dependency-repair-validation/candidate.txt
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-validation-${{ needs.resolve.outputs.candidate }}
          path: |
            reports/dependency-repair-validation/
            reports/sbom/
            reports/deployment-*.json
            reports/deployment-*.json.journal.jsonl
          if-no-files-found: warn
          retention-days: 14
  audits:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ needs.resolve.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - run: npm install --global npm@10.8.2 --ignore-scripts --no-audit --fund=false
      - name: Capture both audit scopes without suppressing the outcome
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p reports/dependency-repair
          npm audit --package-lock-only --ignore-scripts --include=dev --json --audit-level=high > reports/dependency-repair/audit-full.json
          full=$?
          npm audit --package-lock-only --ignore-scripts --omit=dev --json --audit-level=high > reports/dependency-repair/audit-production.json
          production=$?
          printf 'full=%s\nproduction=%s\n' "$full" "$production" | tee reports/dependency-repair/audit-exits.txt
          node -e 'for(const s of ["full","production"]){const r=require("./reports/dependency-repair/audit-"+s+".json");console.log(s,JSON.stringify(r.metadata?.vulnerabilities));for(const [n,v] of Object.entries(r.vulnerabilities||{}))if(["critical","high"].includes(v.severity))console.log(n,JSON.stringify(v.via));}'
          test "$full" = 0 && test "$production" = 0
      - name: Existing all-lockfile production gate
        if: always()
        run: npm run release:audit-dependencies
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-audits-${{ needs.resolve.outputs.candidate }}
          path: |
            reports/dependency-repair/
            reports/release/dependency-audit/
          if-no-files-found: error
          retention-days: 14
