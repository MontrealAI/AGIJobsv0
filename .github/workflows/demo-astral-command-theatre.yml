name: Astral command theatre
on:
  pull_request:
    paths:
      - 'demo/astral-omnidominion-operating-system-command-theatre/**'
      - '.github/workflows/demo-astral-command-theatre.yml'
  push:
    branches: [main]
    paths:
      - 'demo/astral-omnidominion-operating-system-command-theatre/**'
      - '.github/workflows/demo-astral-command-theatre.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astral-theatre-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Test evidence and rejection boundaries
        run: python -m pytest -q --confcutdir=demo/astral-omnidominion-operating-system-command-theatre/tests demo/astral-omnidominion-operating-system-command-theatre/tests
      - name: Rehearse and verify
        run: |
          python demo/astral-omnidominion-operating-system-command-theatre/run_demo.py
          python demo/astral-omnidominion-operating-system-command-theatre/run_demo.py --verify-report reports/astral-omnidominion-operating-system-command-theatre/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astral-theatre-python-${{ matrix.python }}
          path: reports/astral-omnidominion-operating-system-command-theatre/
          if-no-files-found: error
          retention-days: 14
