name: contracts-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/release/source-scanner-gates-rc16.cjs'
      - 'test/scripts/source-release-integrated-rc16.test.cjs'
      - '.github/workflows/successor-computer.yml'
      - 'integrations/alpha-agent/project-native-source.mjs'
      - 'integrations/alpha-agent/project-source-selector.mjs'
      - 'integrations/alpha-agent/successor-computer-mission-lab.py'
      - 'integrations/alpha-agent/vendor/alpha-computer/source-identity.mjs'
      - 'integrations/alpha-agent/vendor/alpha-computer/source-manifest.json'
      - '.github/workflows/source-release-rc16.yml'
      - '.github/workflows/transformational-compatibility.yml'
      - 'scripts/release/qualify-source-release-rc16.cjs'
      - 'scripts/release/publish-source-release-rc16.cjs'
      - 'scripts/release/source-profile-rc16.cjs'
      - 'scripts/release/source-profile-rc16.json'
      - 'scripts/release/source-native-gates-rc16.cjs'
      - 'scripts/release/source-native-evidence-rc16.cjs'
      - 'scripts/release/verify-transformational-compatibility.mjs'
      - 'test/scripts/source-profile-rc16.test.cjs'
      - 'test/scripts/source-release-rc16.test.cjs'
      - 'test/scripts/source-release-security-rc16-gate.test.cjs'
      - 'test/scripts/source-release-security-rc16-publish.test.cjs'
      - 'test/scripts/transformational-compatibility.test.mjs'
      - 'package.json'
      - '.github/workflows/source-release.yml'
      - 'scripts/release/qualify-source-release.cjs'
      - 'docs/production/RELEASE_NOTES_SOURCE_RC16.md'
      - 'scripts/release/publish-source-release.cjs'
      - 'contracts/**'
      - 'scripts/**'
      - 'test/**'
      - 'hardhat.config.*'
      - 'hardhat.coverage.config.js'
      - 'foundry.toml'
      - 'truffle-config.js'
      - 'config/solidity-compiler.json'
      - 'package*.json'
      - '.github/workflows/contracts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/release/source-scanner-gates-rc16.cjs'
      - 'test/scripts/source-release-integrated-rc16.test.cjs'
      - '.github/workflows/successor-computer.yml'
      - 'integrations/alpha-agent/project-native-source.mjs'
      - 'integrations/alpha-agent/project-source-selector.mjs'
      - 'integrations/alpha-agent/successor-computer-mission-lab.py'
      - 'integrations/alpha-agent/vendor/alpha-computer/source-identity.mjs'
      - 'integrations/alpha-agent/vendor/alpha-computer/source-manifest.json'
      - '.github/workflows/source-release-rc16.yml'
      - '.github/workflows/transformational-compatibility.yml'
      - 'scripts/release/qualify-source-release-rc16.cjs'
      - 'scripts/release/publish-source-release-rc16.cjs'
      - 'scripts/release/source-profile-rc16.cjs'
      - 'scripts/release/source-profile-rc16.json'
      - 'scripts/release/source-native-gates-rc16.cjs'
      - 'scripts/release/source-native-evidence-rc16.cjs'
      - 'scripts/release/verify-transformational-compatibility.mjs'
      - 'test/scripts/source-profile-rc16.test.cjs'
      - 'test/scripts/source-release-rc16.test.cjs'
      - 'test/scripts/source-release-security-rc16-gate.test.cjs'
      - 'test/scripts/source-release-security-rc16-publish.test.cjs'
      - 'test/scripts/transformational-compatibility.test.mjs'
      - 'package.json'
      - '.github/workflows/source-release.yml'
      - 'scripts/release/qualify-source-release.cjs'
      - 'docs/production/RELEASE_NOTES_SOURCE_RC16.md'
      - 'scripts/release/publish-source-release.cjs'
      - 'contracts/**'
      - 'scripts/**'
      - 'test/**'
      - 'hardhat.config.*'
      - 'hardhat.coverage.config.js'
      - 'foundry.toml'
      - 'truffle-config.js'
      - 'config/solidity-compiler.json'
      - 'package*.json'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    runs-on: ubuntu-24.04

    env:
      COVERAGE_MIN: '90'
      ACCESS_CONTROL_PATHS: 'contracts/v2/admin,contracts/v2/governance'

      FEE_PCT: '0.02'
      BURN_PCT: '0.06'
      TREASURY: '0x1111111111111111111111111111111111111111'
      VALIDATORS_PER_JOB: '3'
      REQUIRED_APPROVALS: '3'
      COMMIT_WINDOW: '30m'
      REVEAL_WINDOW: '30m'

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache Hardhat compilers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/hardhat-nodejs
          key: hardhat-${{ runner.os }}-${{ hashFiles('hardhat.config.js', 'package-lock.json') }}
          restore-keys: |
            hardhat-${{ runner.os }}-

      - name: Preflight toolchain locks
        run: npm run ci:preflight

      - name: Install dependencies
        run: ./scripts/ci/npm-ci.sh

      - name: Compile
        env:
          COVERAGE_MIN: 90
        run: |
          npx ts-node --compiler-options '{"module":"commonjs"}' scripts/generate-constants.ts
          npx hardhat compile

      - name: Regenerate constants for tests
        run: npx ts-node --compiler-options '{"module":"commonjs"}' scripts/generate-constants.ts

      - name: Enforce production contract sizes
        run: npm run release:check-size

      - name: Enforce compiler identity, fresh sources and diagnostic policy
        run: |
          mkdir -p reports/compiler
          node scripts/ci/check-solidity-build.cjs > reports/compiler/build.json
          cat reports/compiler/build.json
          node scripts/deploy/archive-verification.cjs --output reports/compiler/verification

      - name: Retain compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/compiler/
          if-no-files-found: error
          overwrite: true

      - name: Node/Hardhat tests
        run: npm test

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e
        with:
          version: 'v1.4.4'

      - name: Purge Foundry compiler cache
        run: rm -rf ~/.foundry/cache ~/.cache/foundry

      - name: Ensure forge-std dependency
        run: |
          if [ ! -d lib/forge-std ]; then
            forge install foundry-rs/forge-std --no-git
          else
            echo 'forge-std already present; skipping install.'
          fi

      - name: Foundry tests
        run: forge test -vvvv --ffi --fuzz-runs 256 --match-contract 'CommitReveal|Stake|Fee|Slashing'

      - name: Foundry invariant tests
        env:
          FOUNDRY_INVARIANT_RUNS: 256
        run: forge test -vvvv --ffi --match-path 'test/v2/invariant/*.t.sol'
