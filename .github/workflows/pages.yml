      - 'test/scripts/source-release-integrated-rc16.test.cjs'
      - '.github/workflows/successor-computer.yml'
      - 'integrations/alpha-agent/project-native-source.mjs'
      - 'integrations/alpha-agent/project-source-selector.mjs'
      - 'integrations/alpha-agent/successor-computer-mission-lab.py'
      - 'integrations/alpha-agent/vendor/alpha-computer/source-identity.mjs'
      - 'integrations/alpha-agent/vendor/alpha-computer/source-manifest.json'
      - '.github/workflows/source-release-rc16.yml'
      - '.github/workflows/transformational-compatibility.yml'
      - 'scripts/release/qualify-source-release-rc16.cjs'
      - 'scripts/release/publish-source-release-rc16.cjs'
      - 'scripts/release/source-profile-rc16.cjs'
      - 'scripts/release/source-profile-rc16.json'
      - 'scripts/release/source-native-gates-rc16.cjs'
      - 'scripts/release/source-native-evidence-rc16.cjs'
      - 'scripts/release/verify-transformational-compatibility.mjs'
      - 'test/scripts/source-profile-rc16.test.cjs'
      - 'test/scripts/source-release-rc16.test.cjs'
      - 'test/scripts/source-release-security-rc16-gate.test.cjs'
      - 'test/scripts/source-release-security-rc16-publish.test.cjs'
      - 'integrations/alpha-agent/tests/transformational-compatibility.test.mjs'
      - '.github/workflows/source-release.yml'
      - 'scripts/release/qualify-source-release.cjs'
      - 'docs/production/RELEASE_NOTES_SOURCE_RC16.md'
      - 'scripts/release/publish-source-release.cjs'
      - '**/*.md'
      - '**/*.mmd'
      - '**/*.html'
      - 'orchestrator/analytics.py'
      - 'apps/onebox-static/**'
      - 'website/**'
      - 'packages/successor-core/**'
      - 'scripts/pages/**'
      - 'scripts/demo/**'
      - 'test/pages/**'
      - 'demo/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'scripts/release/source-scanner-gates-rc16.cjs'
      - 'test/scripts/source-release-integrated-rc16.test.cjs'
      - '.github/workflows/successor-computer.yml'
      - 'integrations/alpha-agent/project-native-source.mjs'
      - 'integrations/alpha-agent/project-source-selector.mjs'
      - 'integrations/alpha-agent/successor-computer-mission-lab.py'
      - 'integrations/alpha-agent/vendor/alpha-computer/source-identity.mjs'
      - 'integrations/alpha-agent/vendor/alpha-computer/source-manifest.json'
      - '.github/workflows/source-release-rc16.yml'
      - '.github/workflows/transformational-compatibility.yml'
      - 'scripts/release/qualify-source-release-rc16.cjs'
      - 'scripts/release/publish-source-release-rc16.cjs'
      - 'scripts/release/source-profile-rc16.cjs'
      - 'scripts/release/source-profile-rc16.json'
      - 'scripts/release/source-native-gates-rc16.cjs'
      - 'scripts/release/source-native-evidence-rc16.cjs'
      - 'scripts/release/verify-transformational-compatibility.mjs'
      - 'test/scripts/source-profile-rc16.test.cjs'
      - 'test/scripts/source-release-rc16.test.cjs'
      - 'test/scripts/source-release-security-rc16-gate.test.cjs'
      - 'test/scripts/source-release-security-rc16-publish.test.cjs'
      - 'integrations/alpha-agent/tests/transformational-compatibility.test.mjs'
      - '.github/workflows/source-release.yml'
      - 'scripts/release/qualify-source-release.cjs'
      - 'docs/production/RELEASE_NOTES_SOURCE_RC16.md'
      - 'scripts/release/publish-source-release.cjs'
      - '**/*.md'
      - '**/*.mmd'
      - '**/*.html'
      - 'orchestrator/analytics.py'
      - 'apps/onebox-static/**'
      - 'website/**'
      - 'packages/successor-core/**'
      - 'scripts/pages/**'
      - 'scripts/demo/**'
      - 'test/pages/**'
      - 'demo/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-observatory-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify demo website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked dependencies
        run: ./scripts/ci/npm-ci.sh
      - name: Install locked Culture Studio workspace
        working-directory: demo/CULTURE-v0
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify original repository Mermaid sources
        run: npm run site:mermaid
      - name: Verify catalog and build the complete site
        run: |
          npm run demos -- --check
          npm run docs:verify
          npm run site:build
          npm run site:test
          npm run successor:test
          npm run successor:verify
      - name: Verify interactions, accessibility, layouts and diagrams
        run: |
          npm run site:qa
          PHASE8_SITE_ROOT=build/pages/experiments/phase8 npm run demo:phase8:qa
          npm run demo:kardashev-business:qa
          npm run demo:omnisovereign:qa
          npm run demo:meta-agentic-alpha:qa
          HYPERNOVA_SITE_ROOT=build/pages/experiments/zenith-hypernova npm run demo:zenith-hypernova:qa
          HGM_SITE_ROOT=build/pages/experiments/huxley-godel npm run demo:hgm:qa
          SYNTHESIS_SITE_ROOT=build/pages/experiments/program-synthesis npm run demo:program-synthesis:qa
          node scripts/pages/culture-qa.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-observatory-browser-evidence
          path: reports/pages/
          retention-days: 14
      - name: Save reviewable website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-observatory-preview
          path: build/pages/
          retention-days: 7
      - name: Package GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: build/pages

  deploy:
    name: Publish verified demo website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify published source revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = os.environ['PAGE_URL'].rstrip('/') + '/catalog.json?revision=' + os.environ['GITHUB_SHA']
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      manifest = json.load(response)
                  assert manifest['revision'] == os.environ['GITHUB_SHA'], 'Published revision has not propagated yet'
                  assert manifest['directories'] > 0 and manifest['guides'] > 0
                  print('Verified live demo site:', os.environ['PAGE_URL'], manifest['revision'])
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(10)
          PY
