name: static-analysis

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/inherited-codeql-*"
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  actions: write
  security-events: write

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slither:
    name: Slither static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Cache Hardhat compilers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/hardhat-nodejs
          key: hardhat-${{ runner.os }}-${{ hashFiles('hardhat.config.js', 'package-lock.json') }}
          restore-keys: |
            hardhat-${{ runner.os }}-

      - name: Preflight toolchain locks
        run: npm run ci:preflight

      - name: Install dependencies
        run: ./scripts/ci/npm-ci.sh --no-audit --prefer-offline --progress=false

      - name: Prepare security reports directory
        run: mkdir -p reports/security/codeql

      - name: Test Slither severity policy
        run: node --test test/scripts/slither-policy.test.cjs

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Slither toolchain
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer==0.10.4 solc-select==1.0.4

      - name: Install solc versions (with mirror fallback)
        run: python scripts/ci/install_solc_versions.py --default 0.8.37 0.8.37
        env:
          SOLC_SELECT_USER_AGENT: github-actions/solc-select

      - name: Warm Hardhat build cache
        run: |
          set -euo pipefail
          npx ts-node --compiler-options '{"module":"commonjs"}' scripts/generate-constants.ts
          npx hardhat compile

      - name: Run Slither static analysis
        run: |
          set -euo pipefail
          mkdir -p reports/security
          slither . \
            --compile-force-framework Hardhat \
            --skip-clean \
            --solc-remaps '@openzeppelin=node_modules/@openzeppelin/' \
            --filter-paths 'node_modules|contracts/(legacy|test|v2/mocks)' \
            --exclude locked-ether \
            --fail-none \
            --sarif reports/security/slither.sarif

      - name: Enforce Slither high severity policy
        run: |
          set -euo pipefail
          node tools/security/validate-slither.mjs \
            reports/security/slither.sarif \
            tools/security/slither-allowlist.json

      - name: Upload SARIF to security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: reports/security/slither.sarif

      - name: Upload Slither artefacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: slither-security-report
          path: reports/security

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: ./scripts/ci/npm-ci.sh --no-audit --prefer-offline --progress=false

      - name: Validate additive source scope and exact scan identity
        run: |
          cat > "$RUNNER_TEMP/agijobs-codeql-source-check.cjs" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs'), cp = require('node:child_process'), crypto = require('node:crypto');
          const yaml = require('js-yaml'), matcher = require('minimatch');
          const match = typeof matcher === 'function' ? matcher : matcher.minimatch;
          const hash = raw => crypto.createHash('sha256').update(raw).digest('hex');
          const oldRaw = fs.readFileSync('.github/codeql/config.yml', 'utf8');
          const expandedRaw = fs.readFileSync('.github/codeql/config-integrations.yml', 'utf8');
          assert.equal(hash(oldRaw), '4b34450e1dcc0b489feea158d642a6b66261d9e935463928782219c8716c0892', 'Historical CodeQL policy changed');
          const old = yaml.load(oldRaw), expanded = yaml.load(expandedRaw);
          assert.deepEqual(expanded.paths, [...old.paths, 'integrations/alpha-agent', 'website/assets']);
          assert.deepEqual(expanded['paths-ignore'], old['paths-ignore'].flatMap(pattern => pattern === '**/docs/**' ? old.paths.map(root => root + '/**/docs/**') : [pattern]));
          assert.deepEqual({...expanded, paths: old.paths, 'paths-ignore': old['paths-ignore']}, old, 'Query suites/defaults and all other policy must remain unchanged');
          const admitted = (file, policy) => policy.paths.some(root => file === root || file.startsWith(root + '/')) && !policy['paths-ignore'].some(pattern => match(file, pattern, {dot:true}));
          const env = {...Object.fromEntries(Object.entries(process.env).filter(([key]) => !key.startsWith('GIT_'))), GIT_CONFIG_NOSYSTEM:'1', GIT_CONFIG_GLOBAL:'/dev/null', GIT_NO_REPLACE_OBJECTS:'1'};
          const git = (...args) => cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.fsmonitor=false', ...args], {encoding:'utf8', env, maxBuffer:32*1024*1024});
          const source = git('rev-parse','HEAD').trim(), tree = git('rev-parse', source + '^{tree}').trim();
          assert.match(source,/^[a-f0-9]{40}$/); assert.match(tree,/^[a-f0-9]{40}$/);
          assert.equal(source, process.env.GITHUB_SHA, 'CodeQL checkout differs from its run source');
          assert.equal(git('diff','--no-ext-diff','--no-textconv','--name-only',source,'--').trim(), '', 'Tracked source differs before scanning');
          const run = Number(process.env.GITHUB_RUN_ID), attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
          assert(Number.isSafeInteger(run) && run > 0 && Number.isSafeInteger(attempt) && attempt > 0);
          const files = git('ls-tree','-r','--name-only','-z',source).split('\0').filter(Boolean);
          for (const row of git('ls-tree','-r','-z',source).split('\0').filter(Boolean)) {
            const at = row.indexOf('\t'), header = /^(100644|100755) blob ([a-f0-9]{40})$/.exec(row.slice(0, at)), name = row.slice(at + 1);
            assert(header && !name.startsWith('/') && name.split('/').every(part => part && part !== '.' && part !== '..'), 'Tracked source must have a regular Git identity');
            let parent = '.';
            for (const part of name.split('/').slice(0,-1)) { parent += '/' + part; assert(fs.lstatSync(parent).isDirectory(), 'Tracked source ancestor is not a real directory'); }
            assert(fs.lstatSync(name).isFile(), 'Tracked source is not a regular file');
            const fd = fs.openSync(name, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
            try {
              const before = fs.fstatSync(fd); assert(before.isFile() && before.size <= 256*1024*1024, 'Tracked source exceeds file bound');
              const bytes = Buffer.alloc(before.size); let offset = 0;
              while (offset < bytes.length) { const read = fs.readSync(fd, bytes, offset, bytes.length - offset, offset); assert(read > 0, 'Tracked source was truncated'); offset += read; }
              assert.equal(fs.readSync(fd, Buffer.alloc(1), 0, 1, before.size), 0, 'Tracked source grew during read');
              const after = fs.fstatSync(fd);
              assert(['dev','ino','size','mtimeMs','ctimeMs','mode'].every(key => before[key] === after[key]), 'Tracked source changed while read');
              assert.equal(crypto.createHash('sha1').update('blob ' + bytes.length + '\0').update(bytes).digest('hex'), header[2], 'Tracked source bytes differ from its Git blob');
              assert.equal(Boolean(before.mode & 0o111), header[1] === '100755', 'Tracked source executable mode differs');
            } finally { fs.closeSync(fd); }
          }
          assert.deepEqual(git('ls-files','--others','--exclude-standard','-z').split('\0').filter(Boolean).filter(file => admitted(file, expanded)), [], 'Nonignored untracked scan source is present');
          const oldFiles = files.filter(file => admitted(file, old));
          assert(oldFiles.length > 0 && oldFiles.every(file => admitted(file, expanded)), 'Previously admitted source was excluded');
          for (const root of old.paths) for (const tail of ['docs/probe.js','nested/docs/probe.js','lib/probe.js','node_modules/probe.js']) assert.equal(admitted(root + '/' + tail, expanded), admitted(root + '/' + tail, old));
          const integration = ['four-repo-computer-lifecycle.cjs','four-repo-computer-receipt.mjs','pinned-alpha-checkout.cjs','transformational-work-request.mjs','vendor/alpha/docs/assets/successor/engine.mjs'].map(file => 'integrations/alpha-agent/' + file);
          assert(integration.every(file => admitted(file, expanded)), 'Integration closure is excluded');
          const browser = ['computer-receipt.mjs','computer-receipt-model.mjs','computer-receipt-copy.mjs','computer-desk.mjs','computer-desk-runtime-source.mjs','computer-mission.js','computer-mission-copy.mjs'].map(file => 'website/assets/' + file);
          assert(browser.every(file => admitted(file, expanded)), 'Native browser closure is excluded');
          const requiredExtractedFiles = files.filter(file => /^(?:integrations\/alpha-agent|website\/assets)\//.test(file) && /\.(?:[cm]?[jt]sx?)$/i.test(file) && !/\.d\.[cm]?ts$/i.test(file) && admitted(file, expanded)).sort();
          assert(requiredExtractedFiles.some(file => file.startsWith('integrations/alpha-agent/')), 'Integration executable source is absent');
          assert(requiredExtractedFiles.some(file => file.startsWith('website/assets/')), 'Browser executable source is absent');
          assert.equal(git('rev-parse','HEAD').trim(), source, 'CodeQL HEAD changed during source validation');
          assert.equal(git('rev-parse','HEAD^{tree}').trim(), tree, 'CodeQL tree changed during source validation');
          assert.equal(source, process.env.GITHUB_SHA, 'CodeQL final source differs from its run source');
          console.log(JSON.stringify({schema:'agijobsv0/codeql-scope/2', source, tree, run, attempt, event:process.env.GITHUB_EVENT_NAME, ref:process.env.GITHUB_REF, historicalConfigSha256:hash(oldRaw), configSha256:hash(expandedRaw), staticAdmittedBefore:oldFiles.length, staticAdditionalAdmitted:files.filter(file => !admitted(file, old) && admitted(file, expanded)).length, allPreviousPathsRetained:true, integrationClosureAdmitted:true, browserClosureAdmitted:true, requiredExtractedFiles, actualExtractionRequiresSARIF:true}));
          NODE
          mkdir -p reports/security/codeql
          node < "$RUNNER_TEMP/agijobs-codeql-source-check.cjs" > reports/security/codeql/source-scope-before.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript
          config-file: .github/codeql/config-integrations.yml
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          output: reports/security/codeql

      - name: Recheck exact source after CodeQL analysis
        run: node < "$RUNNER_TEMP/agijobs-codeql-source-check.cjs" > reports/security/codeql/source-scope-after.json

      - name: Retain and enforce actual complete source extraction
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs'), crypto = require('node:crypto');
          const folder = 'reports/security/codeql/';
          const before = JSON.parse(fs.readFileSync(folder + 'source-scope-before.json','utf8'));
          const after = JSON.parse(fs.readFileSync(folder + 'source-scope-after.json','utf8'));
          assert.deepEqual(after, before, 'Source identity/scope changed across actual analysis');
          assert.equal(before.source, process.env.GITHUB_SHA);
          assert.equal(before.run, Number(process.env.GITHUB_RUN_ID));
          assert.equal(before.attempt, Number(process.env.GITHUB_RUN_ATTEMPT));
          const raw = fs.readFileSync(folder + 'javascript.sarif');
          const sarif = JSON.parse(raw);
          assert(Array.isArray(sarif.runs) && sarif.runs.length === 1, 'Expected complete JavaScript SARIF run');
          const scan = sarif.runs[0];
          assert(scan.invocations?.some(invocation => invocation.executionSuccessful === true) && scan.invocations.every(invocation => invocation.executionSuccessful !== false), 'Scanner did not complete successfully');
          const extracted = [...new Set(scan.invocations.flatMap(invocation => invocation.toolExecutionNotifications || []).filter(item => item.descriptor?.id === 'js/diagnostics/successfully-extracted-files').flatMap(item => (item.locations || []).map(location => location.physicalLocation?.artifactLocation?.uri)).filter(Boolean))].sort();
          assert(extracted.length > 0, 'Actual successfully-extracted-file diagnostics are absent');
          const missing = before.requiredExtractedFiles.filter(file => !extracted.includes(file));
          const components = [scan.tool.driver, ...(scan.tool.extensions || [])];
          const rules = [...new Set(components.flatMap(component => (component.rules || []).map(rule => rule.id)))].sort();
          const report = {schema:'agijobsv0/codeql-extraction/1', source:before.source, tree:before.tree, run:before.run, attempt:before.attempt, event:before.event, ref:before.ref, configSha256:before.configSha256, sarifSha256:crypto.createHash('sha256').update(raw).digest('hex'), successfulExtractionFiles:extracted, requiredExtractedFiles:before.requiredExtractedFiles, missingRequiredExtractedFiles:missing, ruleIds:rules, rawResultCount:(scan.results || []).length, resultDisposition:'REQUIRES_INDEPENDENT_FINAL_SOURCE_REVIEW'};
          fs.writeFileSync(folder + 'source-extraction.json', JSON.stringify(report,null,2) + '\n', {flag:'wx',mode:0o600});
          assert.deepEqual(missing, [], 'Intended integration/browser source was not actually extracted');
          console.log(JSON.stringify({source:before.source, tree:before.tree, extractedFiles:extracted.length, requiredFiles:before.requiredExtractedFiles.length, rawResults:report.rawResultCount, independentResultReviewRequired:true}));
          NODE

      - name: Upload CodeQL artefacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-security-report-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/security/codeql
          if-no-files-found: warn
