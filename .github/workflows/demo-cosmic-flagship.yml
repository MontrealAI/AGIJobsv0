name: demo-cosmic-flagship

on:
  pull_request:
    paths:
      - 'demo/cosmic-omni-sovereign-symphony/**'
      - 'scripts/v2/**'
      - 'scripts/phase6/config-validation.ts'
      - 'demo/aurora/bin/local-*'
      - 'test/simulation/test_cosmic_modes.py'
      - 'test/scripts/cosmic-local-config.test.cjs'
      - 'test/scripts/cosmic-runtime.test.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/demo-cosmic-flagship.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  flagship-dry-run:
    name: Flagship explicit offline fixture and safety
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            uploads.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            actions.githubusercontent.com:443
            actions-results.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443
            binaries.soliditylang.org:443
            codeload.github.com:443

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Check inert mode and local configuration boundaries
        run: |
          python3 test/simulation/test_cosmic_modes.py
          node --test test/scripts/cosmic-local-config.test.cjs
          bash -n demo/cosmic-omni-sovereign-symphony/bin/{flagship-demo,orchestrate,modes,execution}.sh

      - name: Install locked dependencies explicitly
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci

      - name: Check governance schema, ABI inputs, CommonJS loaders and inert effects
        run: node --test test/scripts/cosmic-runtime.test.cjs

      - name: Generate synthetic governance and offline mission fixtures
        run: bash demo/cosmic-omni-sovereign-symphony/bin/flagship-demo.sh --ci --mode offline-fixture

      - name: Verify substantive flagship artifacts
        run: node demo/cosmic-omni-sovereign-symphony/scripts/verify-flagship-report.mjs --reports-root reports/agi-os

      - name: Upload flagship artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cosmic-flagship-demo
          path: |
            demo/cosmic-omni-sovereign-symphony/logs/flagship-demo/**
            demo/cosmic-omni-sovereign-symphony/logs/ledger-latest.json
            demo/cosmic-omni-sovereign-symphony/logs/vote-simulation.json
            demo/cosmic-omni-sovereign-symphony/logs/execution-plan.json
            demo/cosmic-omni-sovereign-symphony/logs/run-status.json
            reports/agi-os/**
          if-no-files-found: error
