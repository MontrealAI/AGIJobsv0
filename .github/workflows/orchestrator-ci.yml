name: orchestrator-ci

on:
  pull_request:
    paths:
      - 'apps/orchestrator/**'
      - 'packages/successor-core/**'
      - 'scripts/package-runtime-assets.cjs'
      - 'agent-gateway/agentEndpoint.ts'
      - 'demo/One-Box/computer-work/**'
      - 'package*.json'
      - '.github/workflows/orchestrator-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/orchestrator/**'
      - 'packages/successor-core/**'
      - 'scripts/package-runtime-assets.cjs'
      - 'agent-gateway/agentEndpoint.ts'
      - 'demo/One-Box/computer-work/**'
      - 'package*.json'
      - '.github/workflows/orchestrator-ci.yml'

permissions:
  contents: read

concurrency:
  group: orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: ./scripts/ci/npm-ci.sh
      - name: Build and verify computer-work boundaries
        run: |
          npm run build:orchestrator
          node --test apps/orchestrator/dist/apps/orchestrator/__tests__/computerWork.test.js apps/orchestrator/dist/apps/orchestrator/__tests__/successorComputerWork.test.js
          npm run successor:test
          npm run successor:verify
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify actual browser work and independent rejection
        run: node --test demo/One-Box/computer-work/test.cjs
      - name: Preserve computer-work evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: computer-work-browser-evidence
          path: |
            reports/computer-work/
            reports/successor/
          retention-days: 14
