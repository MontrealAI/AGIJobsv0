name: release-mainnet

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Read-only deployment candidate target'
        type: choice
        options: [mainnet, sepolia]
        default: mainnet
      confirm:
        description: 'Type YES to generate a candidate; this does not deploy'
        required: true
        default: 'NO'

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit
      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "YES" || { echo "Candidate generation not confirmed"; exit 1; }

  build-plan:
    needs: guardrails
    runs-on: ubuntu-24.04
    env:
      AGJ_NETWORK: ${{ inputs.network }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: ./scripts/ci/npm-ci.sh

      - name: Compile (scripts & constants)
        run: |
          npx ts-node --compiler-options '{"module":"commonjs"}' scripts/generate-constants.ts
          npx hardhat compile

      - name: Enforce production contract size limits
        run: npm run release:check-size

      - name: Test candidate validation
        run: node --test test/scripts/deployment-candidate.test.cjs

      - name: Build read-only deployment candidate
        env:
          TARGET_NETWORK: ${{ inputs.network }}
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          npx ts-node scripts/v2/plan-deploy.ts --network "$TARGET_NETWORK" --out plan.json
          jq -e '.schema == "agi-jobs/deployment-candidate/v1" and .status == "candidate-for-review" and .executable == false and .productionApproved == false and (.blockers | length == 0)' plan.json >/dev/null

      - name: Preserve candidate and blocking findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-candidate-${{ inputs.network }}
          path: plan.json
          if-no-files-found: warn
