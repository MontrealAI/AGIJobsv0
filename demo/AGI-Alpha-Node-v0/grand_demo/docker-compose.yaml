version: "3.9"
services:
  alpha-node:
    build: .
    container_name: agi-alpha-node
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./config:/app/config
      - ./storage:/app/storage
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9108:9108"
    # The image ENTRYPOINT already launches scripts/run_demo.py.
    restart: unless-stopped
