<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="title desc">
<title id="title">The six-phase meta-agentic loop</title><desc id="desc">Identify leads to learning, thinking, design, strategy and execution. Each stage produces a checked artifact. New observations can inform a separately reviewed future iteration.</desc>
<defs><linearGradient id="node" x2="1" y2="1"><stop stop-color="#39204f"/><stop offset="1" stop-color="#1c102a"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#c299ef"/></marker></defs>
<g fill="none" stroke="#c299ef" stroke-width="2" marker-end="url(#arrow)"><path d="M310 65H410"/><path d="M535 105V190"/><path d="M410 230H310"/><path d="M185 270V355"/><path d="M310 395H410"/></g>
<g fill="url(#node)" stroke="#77558f"><rect x="60" y="25" width="250" height="80" rx="16"/><rect x="410" y="25" width="250" height="80" rx="16"/><rect x="410" y="190" width="250" height="80" rx="16"/><rect x="60" y="190" width="250" height="80" rx="16"/><rect x="60" y="355" width="250" height="80" rx="16"/><rect x="410" y="355" width="250" height="80" rx="16" stroke="#96f2d7"/></g>
<g fill="#f8f4ff" font-family="system-ui,sans-serif" text-anchor="middle" font-size="18"><text x="185" y="60">01 · Identify</text><text x="535" y="60">02 · Out-Learn</text><text x="535" y="225">03 · Out-Think</text><text x="185" y="225">04 · Out-Design</text><text x="185" y="390">05 · Out-Strategise</text><text x="535" y="390">06 · Out-Execute</text></g>
<g fill="#d6c5e6" font-family="system-ui,sans-serif" text-anchor="middle" font-size="12"><text x="185" y="85">Scope valuable computer work</text><text x="535" y="85">Qualify from review observations</text><text x="535" y="250">Route to a qualified specialist</text><text x="185" y="250">Define evidence and acceptance</text><text x="185" y="415">Reserve budget and reviewer time</text><text x="535" y="415">Deliver inspectable work orders</text><text x="360" y="477">New observations → reviewed learning → a separately admitted next run</text></g></svg>
