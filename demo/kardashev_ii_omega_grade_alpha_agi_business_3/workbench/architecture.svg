<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc"><title id="title">Authorized work to reviewed settlement</title><desc id="desc">Specialists create evidence from admitted work. Automated checking can send it back for revision. Independent review and a separate signer are required for settlement. The owner can stop execution.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b98fed"/></marker></defs><g fill="none" stroke="#b98fed" stroke-width="1.5" marker-end="url(#a)"><path d="M232 88H290"/><path d="M480 88H538"/><path d="M738 88H803"/><path d="M900 123V205H738"/><path d="M538 237H482"/><path d="M630 123V156H385V123"/><path d="M138 205V123"/></g><g fill="#1f1531" stroke="#674287"><rect x="32" y="50" width="200" height="75" rx="8"/><rect x="290" y="50" width="190" height="75" rx="8"/><rect x="538" y="50" width="200" height="75" rx="8"/><rect x="803" y="50" width="225" height="75" rx="8"/><rect x="538" y="203" width="200" height="65" rx="8"/><rect x="290" y="203" width="190" height="65" rx="8"/><rect x="32" y="203" width="200" height="65" rx="8"/></g><g text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#eee1ff"><text x="132" y="80">Authorized work</text><text x="385" y="80">Specialist execution</text><text x="638" y="80">Automated checking</text><text x="915" y="80">Independent review</text><text x="638" y="230">Separate signer</text><text x="385" y="230">Verified settlement</text><text x="132" y="230">Owner stop control</text></g><g text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#bdb0ce"><text x="132" y="104">SCOPE · BUDGET · PERMISSIONS</text><text x="385" y="104">ARTIFACTS · TRACES · HASHES</text><text x="638" y="104">RECOMPUTE · TEST · REPRODUCE</text><text x="915" y="104">ACCEPTANCE · CONFLICT CHECK</text><text x="638" y="251">CHAIN · CONTRACT · JOB STATE</text><text x="385" y="251">RECEIPT · FINALITY</text><text x="132" y="251">PAUSE · CANCEL · RECONCILE</text><text x="502" y="176">FAILED CHECK → REVISE</text></g></svg>
