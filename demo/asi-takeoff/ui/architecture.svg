<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 290" role="img" aria-labelledby="title desc"><title id="title">Original ASI Takeoff systems map</title><desc id="desc">Mission owners connect to ASI Takeoff, which connects to the AGI Jobs v0 v2 core. The core connects to unified CI/CD observability and the owner control plane. The original Mermaid source remains in README.md.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#cfa6fc"/></marker></defs><g fill="none" stroke="#cfa6fc" stroke-width="2" marker-end="url(#arrow)"><path d="M164 145H230"/><path d="M430 145H495"/><path d="M695 145H730V72H765"/><path d="M695 145H730V222H765"/></g><g fill="#35234e" stroke="#9673b8" stroke-width="1.5"><ellipse cx="90" cy="145" rx="74" ry="45"/><rect x="230" y="100" width="200" height="90" rx="12"/><rect x="495" y="100" width="200" height="90" rx="12"/><rect x="765" y="27" width="170" height="90" rx="12"/><rect x="765" y="177" width="170" height="90" rx="12"/></g><g fill="#f1eaff" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle"><text x="90" y="141">Mission</text><text x="90" y="164">owners</text><text x="330" y="141">Demo</text><text x="330" y="164">ASI Takeoff</text><text x="595" y="141">AGI Jobs v0 (v2)</text><text x="595" y="164">Core intelligence</text><text x="850" y="66">Unified CI / CD</text><text x="850" y="89">Observability</text><text x="850" y="216">Governance</text><text x="850" y="239">Owner control</text></g></svg>
