version: "3.9"

services:
  agent-node:
    container_name: agi-agent-node
    build:
      context: ..
      dockerfile: deploy/docker/agent-node.Dockerfile
    environment:
      AGENT_ID: agent-001
      AGENT_REGION: us-east
      AGENT_CAPABILITIES: execution,validation
      AGENT_ROUTER: default
      AGENT_REGISTRY_URL: ${AGENT_REGISTRY_URL:?Set the reachable registry URL}
      AGENT_REGISTRY_OWNER_TOKEN: ${AGENT_REGISTRY_OWNER_TOKEN:?Set the registry owner token}
      AGENT_HEARTBEAT_SECRET: ${AGENT_HEARTBEAT_SECRET:?Set a unique heartbeat secret}
    volumes:
      - ./agent-data:/var/lib/agent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 5s
      retries: 3
